<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      color: #333;
      background: #fff;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #ddd;
      background: #f5f5f5;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    button {
      padding: 4px 10px;
      font-size: 11px;
      border: 1px solid #bbb;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
    }
    button:hover { background: #eee; }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }
    .tab {
      padding: 6px 14px;
      font-size: 12px;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      cursor: pointer;
      color: #555;
    }
    .tab.active {
      color: #1a73e8;
      border-bottom-color: #1a73e8;
      font-weight: 600;
    }
    .tab .badge {
      display: inline-block;
      min-width: 16px;
      padding: 0 4px;
      margin-left: 4px;
      font-size: 10px;
      line-height: 16px;
      text-align: center;
      border-radius: 8px;
      background: #e0e0e0;
      color: #333;
    }
    .tab .badge.error { background: #fce8e6; color: #c5221f; }
    .tab .badge.warn  { background: #fef7e0; color: #ea8600; }

    .panel-content {
      overflow: auto;
      height: calc(100vh - 82px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 4px 8px;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 500px;
    }
    th {
      position: sticky;
      top: 0;
      background: #f5f5f5;
      font-weight: 600;
      font-size: 11px;
      color: #666;
    }
    tr:hover { background: #f0f7ff; }

    .status-ok { color: #188038; }
    .status-warn { color: #ea8600; }
    .status-error { color: #c5221f; }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: #888;
    }

    .url-cell {
      font-family: monospace;
      font-size: 11px;
    }

    .summary-bar {
      display: flex;
      gap: 16px;
      padding: 8px 12px;
      background: #f9f9f9;
      border-bottom: 1px solid #eee;
      font-size: 11px;
      color: #555;
    }
    .summary-bar .stat { font-weight: 600; }
    .summary-bar .stat.error { color: #c5221f; }

    .filter-bar {
      padding: 6px 12px;
      border-bottom: 1px solid #eee;
      background: #fafafa;
    }
    .filter-bar input {
      width: 100%;
      padding: 4px 8px;
      font-size: 11px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <header>
    <h1>WebLoad Troubleshooter</h1>
    <div class="toolbar">
      <button id="btn-refresh">Refresh</button>
      <button id="btn-clear">Clear</button>
      <button id="btn-export">Export CSV</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="failures">Blocked / Failed <span class="badge error" id="badge-failures">0</span></button>
    <button class="tab" data-tab="csp">CSP Violations <span class="badge warn" id="badge-csp">0</span></button>
    <button class="tab" data-tab="errors">JS Errors <span class="badge error" id="badge-errors">0</span></button>
    <button class="tab" data-tab="all">All Requests <span class="badge" id="badge-all">0</span></button>
  </div>

  <div class="summary-bar" id="summary-bar"></div>

  <div class="filter-bar">
    <input type="text" id="filter-input" placeholder="Filter by URL, type, or error...">
  </div>

  <div class="panel-content" id="panel-content"></div>

  <script src="panel.js"></script>
</body>
</html>
